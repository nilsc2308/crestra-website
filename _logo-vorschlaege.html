<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>crestra – Schriftzug-Varianten</title>
<style>
@font-face{font-family:"Hanken";src:url(fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2-variations");font-weight:100 900}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-latin-opsz-italic.woff2) format("woff2-variations");font-style:italic;font-weight:300 700}
:root{--t:#0a7c9c;--t2:#6fd0de}
body{margin:0;font:400 16px/1.5 "Hanken",system-ui,sans-serif;background:#f4f5f7;color:#111725;padding:40px 24px}
h1{font-weight:700;letter-spacing:-.03em;margin:0 0 6px;font-size:34px}.lead{color:#4a5263;margin:0 0 32px;max-width:60em}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;max-width:1300px}
.k{background:#fff;border:1px solid #e1e5eb;border-radius:14px;overflow:hidden}
.k h2{margin:0;padding:16px 20px;font-size:17px;border-bottom:1px solid #e1e5eb}.k h2 span{color:#6f7889;font-weight:450}
.gross{display:grid;place-items:center;height:190px;font-size:76px}
.zeile{display:flex;align-items:center;height:72px;padding:0 22px;border-top:1px solid #e1e5eb;font-size:27px}
.dunkel{background:#0e1320;color:#fff}
.w{font-weight:780;letter-spacing:-.05em;line-height:1;position:relative;display:inline-block;white-space:nowrap}
/* 1 Welle statt Punkt */
.v1 svg{width:.62em;height:.3em;margin-left:.04em;vertical-align:baseline;overflow:visible}
.v1 path{fill:none;stroke:var(--t);stroke-width:2.6;stroke-linecap:round}.dunkel .v1 path{stroke:var(--t2)}
/* 2 crest + ra kursiv */
.v2 i{font:italic 500 1.08em "Newsreader",Georgia,serif;letter-spacing:-.02em;color:var(--t)}.dunkel .v2 i{color:var(--t2)}
/* 3 Wellenkamm über crest */
.v3 .bogen{position:absolute;left:0;top:-.34em;width:2.45em;height:.32em;overflow:visible}
.v3 .bogen path{fill:none;stroke:var(--t);stroke-width:2.4;stroke-linecap:round}.dunkel .v3 .bogen path{stroke:var(--t2)}
.v3{margin-top:.3em}
/* 4 blinkender Cursor */
.v4 .c{display:inline-block;width:.09em;height:.78em;background:var(--t);margin-left:.06em;vertical-align:-.04em;animation:bl 1.1s steps(1) infinite}
.dunkel .v4 .c{background:var(--t2)}@keyframes bl{50%{opacity:0}}
/* 5 Punkt als gekippte Raute + e in Türkis */
.v5 b{color:var(--t)}.dunkel .v5 b{color:var(--t2)}
.v5 .r{display:inline-block;width:.17em;height:.17em;background:var(--t);transform:rotate(45deg);margin-left:.1em;vertical-align:.02em}.dunkel .v5 .r{background:var(--t2)}
/* 6 Unterstrich-Schwung unter crest */
.v6 .sw{position:absolute;left:-.02em;bottom:-.2em;width:2.45em;height:.24em;overflow:visible}
.v6 .sw path{fill:none;stroke:var(--t);stroke-width:2.8;stroke-linecap:round}.dunkel .v6 .sw path{stroke:var(--t2)}
</style></head><body>
<h1>Schriftzug-Varianten</h1><p class="lead">Alle bauen auf „crestra“ als Schriftzug auf, jeweils groß, in der Kopfzeile und auf dunklem Grund. „crest“ heißt auf Englisch Wellenkamm – darauf spielen einige an. Variante 4 bewegt sich (der Strich blinkt wie beim Tippen).</p>
<div class="raster" id="r"></div>
<script>
const welle='<svg viewBox="0 0 40 16"><path d="M2 11c6 0 7-8 14-8s8 10 15 10c4 0 6-3 7-5"/></svg>';
const V=[
 ['1','Welle statt Punkt','der Punkt wird zur kleinen Welle','<span class="w v1">crestra'+welle+'</span>'],
 ['2','crest + ra','„ra“ kursiv in Türkis, wie die Akzentwörter der Seite','<span class="w v2">crest<i>ra</i></span>'],
 ['3','Wellenkamm','ein Bogen schwingt über „crest“','<span class="w v3"><svg class="bogen" viewBox="0 0 150 16" preserveAspectRatio="none"><path d="M3 14C30 14 40 3 75 3s45 11 72 11"/></svg>crestra</span>'],
 ['4','Cursor','blinkender Strich – „hier wird gerade gebaut“','<span class="w v4">crestra<span class="c"></span></span>'],
 ['5','Raute','„e“ in Türkis, Punkt als gekippte Raute','<span class="w v5">cr<b>e</b>stra<span class="r"></span></span>'],
 ['6','Schwung','handgezogener Schwung unter „crest“','<span class="w v6">crestra<svg class="sw" viewBox="0 0 150 12" preserveAspectRatio="none"><path d="M3 8c40-6 90-8 144-2"/></svg></span>'],
];
r.innerHTML=V.map(([n,t,u,h])=>`<div class="k"><h2>${n} · ${t} <span>– ${u}</span></h2><div class="gross">${h}</div><div class="zeile">${h}</div><div class="zeile dunkel">${h}</div></div>`).join('');
</script></body></html>
